[workspace]
members = ["core", "cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Your Name <you@example.com>"]
license = "MIT"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.41", features = ["full"] }
tokio-tungstenite = "0.24"
futures = "0.3"
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# HTTP/WebSocket
reqwest = { version = "0.12", features = ["json", "stream"] }
tungstenite = "0.24"

# Audio (cross-platform)
cpal = "0.15"
hound = "3.5"

# Configuration
toml = "0.8"
dirs = "5.0"

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Platform-specific
[target.'cfg(target_os = "macos")'.workspace.dependencies]
notify-rust = "4.11"
rdev = "0.5"
