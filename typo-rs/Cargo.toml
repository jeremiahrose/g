[workspace]
members = ["core", "cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Your Name <you@example.com>"]
license = "MIT"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.41", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures = "0.3"
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# HTTP/WebSocket
reqwest = { version = "0.12", features = ["json", "stream"] }
tungstenite = "0.24"

# MCP SDK (official)
rmcp = { version = "0.8", features = ["client", "transport-streamable-http-client-reqwest"] }

# Audio (cross-platform)
cpal = "0.15"
hound = "3.5"
rubato = "0.15"  # High-quality resampling (matches PortAudio quality)

# Configuration
toml = "0.8"
dirs = "5.0"

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Utilities
base64 = "0.22"
wildmatch = "2.3"
http = "1.1"

# macOS-specific (defined here, used conditionally in cli)
notify-rust = "4.11"
rdev = "0.5"
